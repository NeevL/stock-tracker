<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE WATCH — Indian Equities Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0B0E14;
    --panel:#12161F;
    --panel-2:#171C27;
    --border:#232838;
    --text:#E8EAF0;
    --muted:#7C8394;
    --gold:#D4AF37;
    --gain:#23C48E;
    --loss:#FF5D5D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Source Serif 4', serif; }

  /* ---------- Masthead ---------- */
  header.masthead{
    padding:22px 32px 16px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;
  }
  header.masthead .brand{ display:flex; align-items:baseline; gap:14px; }
  header.masthead h1{ font-size:28px; font-weight:700; margin:0; letter-spacing:0.5px; color:var(--gold); }
  header.masthead .tagline{ color:var(--muted); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }
  header.masthead .status{ font-size:12px; color:var(--muted); text-align:right; }
  header.masthead .status span{ color:var(--text); }
  button.refresh{
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 14px;
    cursor:pointer; letter-spacing:1px; text-transform:uppercase; border-radius:2px;
    transition:background .15s, color .15s, border-color .15s;
  }
  button.refresh:hover{ background:rgba(212,175,55,0.1); }
  button.refresh:disabled{ opacity:0.5; cursor:wait; }
  button.theme-toggle{
    display:inline-flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 12px;
    cursor:pointer; letter-spacing:1px; text-transform:uppercase; border-radius:2px;
    transition:background .15s, color .15s, border-color .15s;
  }
  button.theme-toggle:hover{ background:rgba(212,175,55,0.1); }
  .filter-pills{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .filter-pill{
    border:1px solid var(--border); color:var(--text); background:var(--panel);
    padding:7px 12px; border-radius:999px; font-size:12px; cursor:pointer;
    transition:transform .15s, border-color .15s, background .15s;
  }
  .filter-pill:hover{ transform:translateY(-1px); border-color:var(--gold); }
  .filter-pill.active{ background:rgba(212,175,55,0.12); border-color:var(--gold); color:var(--gold); }
  .sort-btn{ background:transparent; border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:2px; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .sort-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .table-highlight{ background:rgba(212,175,55,0.09); }

  /* ---------- Ticker tape ---------- */
  .tape-wrap{ background:var(--panel-2); border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap; }
  .tape{ display:inline-flex; padding:9px 0; animation:scroll 55s linear infinite; }
  .tape:hover{ animation-play-state:paused; }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .tape-item{ display:inline-flex; gap:8px; padding:0 22px; font-size:12.5px; border-right:1px solid var(--border); }
  .tape-item b{ color:var(--text); }
  .up{ color:var(--gain); } .down{ color:var(--loss); } .flat{ color:var(--muted); }

  /* ---------- Layout ---------- */
  main{ padding:24px 32px 60px; max-width:1400px; margin:0 auto; }
  .summary-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:26px;
  }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:3px; padding:16px 18px; }
  .card .label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }
  .card .value{ font-size:22px; font-weight:600; }
  .card .sub{ font-size:11.5px; color:var(--muted); margin-top:4px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  .toolbar input, .toolbar select{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:8px 10px; border-radius:2px;
  }
  .toolbar .count{ color:var(--muted); font-size:12px; margin-left:auto; }
  .toolbar .clear-filters{ background:transparent; border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:2px; cursor:pointer; transition:border-color .15s, color .15s; }
  .toolbar .clear-filters:hover{ border-color:var(--gold); color:var(--gold); }

  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); font-size:12.5px; }
  thead th{
    text-align:left; padding:10px 12px; color:var(--muted); font-weight:500; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.8px; border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap;
  }
  thead th:hover{ color:var(--gold); }
  tbody tr{ border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:var(--panel-2); }
  tbody td{ padding:10px 12px; white-space:nowrap; }
  td.name{ color:var(--muted); font-size:11.5px; }
  .sector-tag{ font-size:10px; color:var(--muted); border:1px solid var(--border); padding:2px 6px; border-radius:2px; }

  /* ---------- Modal ---------- */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(5,6,10,0.75);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{ display:flex; }
  [data-theme='light']{
    --bg:#F4F6FB;
    --panel:#FFFFFF;
    --panel-2:#F1F4FA;
    --border:#D7DCEB;
    --text:#111827;
    --muted:#58627A;
    --gold:#B57D2B;
    --gain:#1F8C47;
    --loss:#C0392B;
  }
  [data-theme='light'] body{ background:var(--bg); color:var(--text); }
  [data-theme='light'] .tape-wrap{ background:var(--panel-2); }
  [data-theme='light'] .card, [data-theme='light'] .toolbar input, [data-theme='light'] .toolbar select, [data-theme='light'] .filter-pill, [data-theme='light'] .sort-btn, [data-theme='light'] .toolbar .clear-filters{ background:var(--panel); }
  [data-theme='light'] .toolbar .clear-filters, [data-theme='light'] .sort-btn{ border-color:var(--border); }
  [data-theme='light'] thead th, [data-theme='light'] tbody td{ color:var(--text); }
  [data-theme='light'] .tape-item{ border-right-color:var(--border); }
  [data-theme='light'] .overlay{ background:rgba(255,255,255,0.85); }
  [data-theme='light'] .modal{ background:var(--panel); border-color:var(--border); }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    width:100%; max-width:820px; max-height:88vh; overflow-y:auto; padding:26px 28px;
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .modal-head h2{ margin:0; font-size:24px; }
  .modal-head .close{ cursor:pointer; color:var(--muted); font-size:22px; line-height:1; }
  .modal-head .close:hover{ color:var(--text); }
  .modal .ticker-sub{ color:var(--muted); font-size:12px; margin-bottom:18px; }
  .metrics-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:18px 0 22px; }
  .metrics-grid .m .label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; }
  .metrics-grid .m .value{ font-size:16px; font-weight:600; margin-top:3px; }
  .chart-controls{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 14px; }
  .chart-range-btn{ background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:999px; font-size:11px; cursor:pointer; transition:all .15s ease; }
  .chart-range-btn:hover{ color:var(--gold); border-color:var(--gold); }
  .chart-range-btn.active{ background:rgba(212,175,55,0.12); color:var(--gold); border-color:var(--gold); }
  canvas#chart{ max-height:320px; height:320px; }
  .empty{ color:var(--muted); text-align:center; padding:40px; }
  footer{ text-align:center; color:var(--muted); font-size:11px; padding:20px; border-top:1px solid var(--border); }
</style>
</head>
<body>

<header class="masthead">
  <div class="brand">
    <h1>NSE WATCH</h1>
    <div class="tagline">Indian Equities Desk</div>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="status">Last updated<br><span id="lastUpdated">—</span></div>
    <button class="refresh" id="refreshBtn">Refresh Data</button>
  </div>
</header>

<div class="tape-wrap"><div class="tape" id="tape">Loading tape…</div></div>

<main>
  <div class="summary-grid" id="summaryGrid"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search ticker or name…">
    <select id="sectorFilter"><option value="">All sectors</option></select>
    <select id="sortBy">
      <option value="market_cap_cr">Sort: Market Cap</option>
      <option value="price">Sort: Price</option>
      <option value="pe_ratio">Sort: P/E Ratio</option>
      <option value="eps">Sort: EPS</option>
      <option value="day_change_pct">Sort: Day Change %</option>
    </select>
    <button class="sort-btn" id="sortDirection">Sort ↓</button>
    <button class="clear-filters" id="clearFilters">Clear filters</button>
    <button class="theme-toggle" id="themeBtn">Light mode</button>
    <span class="count" id="rowCount"></span>
  </div>
  <div class="filter-pills" id="quickFilters"></div>

  <table>
    <thead>
      <tr>
        <th>Ticker</th><th>Company / Sector</th><th>Price (₹)</th><th>Chg %</th>
        <th>Mkt Cap (₹cr)</th><th>P/E</th><th>EPS (₹)</th><th>P/B</th><th>Div Yld %</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</main>

<footer>Data refreshes on demand via <code>POST /api/refresh</code> · Synthetic data is used automatically when live market data is unreachable.</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="mTicker">—</h2>
        <div class="ticker-sub" id="mName">—</div>
      </div>
      <div class="close" id="closeModal">&times;</div>
    </div>
    <div class="metrics-grid" id="mMetrics"></div>
    <div class="chart-controls" id="chartControls">
      <button class="chart-range-btn active" data-days="30">1M</button>
      <button class="chart-range-btn" data-days="90">3M</button>
      <button class="chart-range-btn" data-days="180">6M</button>
      <button class="chart-range-btn" data-days="365">1Y</button>
    </div>
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
const API = '/api';
let stocksCache = [];
let chartInstance = null;
let currentSortOrder = 'desc';
let currentQuickFilter = '';
let activeChartTicker = null;
let activeChartDays = 180;

const fmtNum = (n, d=2) => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-IN', {maximumFractionDigits: d});
const fmtCr = (n) => (n === null || n === undefined) ? '—' : (n >= 100000 ? (n/100000).toFixed(2)+'L' : fmtNum(n,0));
const changeClass = (pct) => pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
const changeSign = (pct) => pct > 0 ? '+' : '';

function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('stockTheme', theme);
  document.getElementById('themeBtn').textContent = theme === 'light' ? 'Dark mode' : 'Light mode';
}

function toggleTheme(){
  setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

function applyQuickFilter(stock){
  if (!currentQuickFilter) return true;
  if (currentQuickFilter === 'gainers') return stock.day_change_pct > 1.5;
  if (currentQuickFilter === 'losers') return stock.day_change_pct < -1.5;
  if (currentQuickFilter === 'highcap') return stock.market_cap_cr >= 20000;
  if (currentQuickFilter === 'value') return stock.pe_ratio && stock.pe_ratio < 18;
  return true;
}

function renderFilterPills(){
  const filters = [
    {id:'', label:'All'},
    {id:'gainers', label:'Top Gainers'},
    {id:'losers', label:'Top Losers'},
    {id:'highcap', label:'Large Cap'},
    {id:'value', label:'Value Picks'}
  ];
  const container = document.getElementById('quickFilters');
  container.innerHTML = filters.map(f => ` <button class="filter-pill${currentQuickFilter===f.id ? ' active' : ''}" data-filter="${f.id}">${f.label}</button>`).join('');
  container.querySelectorAll('.filter-pill').forEach(btn => {
    btn.onclick = () => {
      currentQuickFilter = btn.dataset.filter;
      renderFilterPills();
      renderTable(stocksCache);
    };
  });
}

async function loadAll(){
  const [stocksRes, summaryRes] = await Promise.all([
    fetch(`${API}/stocks`).then(r=>r.json()),
    fetch(`${API}/market-summary`).then(r=>r.json())
  ]);
  stocksCache = stocksRes.stocks;
  renderTape(stocksCache);
  renderSummary(summaryRes);
  populateSectors(stocksCache);
  renderFilterPills();
  renderTable(stocksCache);
  document.getElementById('lastUpdated').textContent =
    summaryRes.last_updated ? new Date(summaryRes.last_updated + 'Z').toLocaleString('en-IN') : '—';
}

function renderTape(stocks){
  const items = stocks.map(s => {
    const cls = changeClass(s.day_change_pct || 0);
    return `<span class="tape-item"><b>${s.ticker}</b> ₹${fmtNum(s.price)} <span class="${cls}">${changeSign(s.day_change_pct)}${fmtNum(s.day_change_pct)}%</span></span>`;
  }).join('');
  document.getElementById('tape').innerHTML = items + items;
}

function renderSummary(s){
  if (s.message){ document.getElementById('summaryGrid').innerHTML = `<div class="empty">${s.message}</div>`; return; }
  const g = s.top_gainer, l = s.top_loser;
  document.getElementById('summaryGrid').innerHTML = `
    <div class="card"><div class="label">Total Market Cap</div><div class="value">₹${fmtCr(s.total_market_cap_cr)} cr</div><div class="sub">${s.companies_tracked} companies tracked</div></div>
    <div class="card"><div class="label">Average P/E</div><div class="value">${fmtNum(s.average_pe_ratio)}x</div><div class="sub">Across tracked universe</div></div>
    <div class="card"><div class="label">Advancing / Declining</div><div class="value"><span class="up">${s.advancing}</span> / <span class="down">${s.declining}</span></div><div class="sub">${s.unchanged} unchanged</div></div>
    <div class="card"><div class="label">Top Gainer</div><div class="value up">${g ? g.ticker : '—'}</div><div class="sub">${g ? changeSign(g.day_change_pct)+fmtNum(g.day_change_pct)+'%' : ''}</div></div>
    <div class="card"><div class="label">Top Loser</div><div class="value down">${l ? l.ticker : '—'}</div><div class="sub">${l ? fmtNum(l.day_change_pct)+'%' : ''}</div></div>
  `;
}

function populateSectors(stocks){
  const sel = document.getElementById('sectorFilter');
  const current = sel.value;
  const sectors = [...new Set(stocks.map(s=>s.sector))].sort();
  sel.innerHTML = '<option value="">All sectors</option>' + sectors.map(s=>`<option value="${s}">${s}</option>`).join('');
  sel.value = current;
}

function renderTable(stocks){
  const q = document.getElementById('search').value.toLowerCase();
  const sector = document.getElementById('sectorFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let rows = stocks.filter(s =>
    (!q || s.ticker.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)) &&
    (!sector || s.sector === sector) &&
    applyQuickFilter(s)
  );
  rows.sort((a,b) => {
    const aVal = a[sortBy] ?? -Infinity;
    const bVal = b[sortBy] ?? -Infinity;
    return currentSortOrder === 'asc' ? aVal - bVal : bVal - aVal;
  });

  document.getElementById('rowCount').textContent = `${rows.length} companies${currentQuickFilter ? ` · ${currentQuickFilter.replace(/^[a-z]/, c => c.toUpperCase())}` : ''}`;
  document.getElementById('tbody').innerHTML = rows.map(s => `
    <tr onclick="openModal('${s.ticker}')">
      <td><b>${s.ticker}</b></td>
      <td class="name">${s.name}<br><span class="sector-tag">${s.sector}</span></td>
      <td>${fmtNum(s.price)}</td>
      <td class="${changeClass(s.day_change_pct||0)}">${changeSign(s.day_change_pct)}${fmtNum(s.day_change_pct)}%</td>
      <td>${fmtCr(s.market_cap_cr)}</td>
      <td>${fmtNum(s.pe_ratio)}</td>
      <td>${fmtNum(s.eps)}</td>
      <td>${fmtNum(s.pb_ratio)}</td>
      <td>${fmtNum(s.dividend_yield_pct)}</td>
    </tr>
  `).join('');
}

function renderChart(ticker, hist){
  const ctx = document.getElementById('chart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: hist.candles.map(c => c.date),
      datasets: [{
        label: `${ticker} Close (₹)`,
        data: hist.candles.map(c => c.close),
        borderColor: '#D4AF37',
        backgroundColor: 'rgba(212,175,55,0.16)',
        pointRadius: 0,
        pointHoverRadius: 5,
        pointBackgroundColor: '#D4AF37',
        borderWidth: 2,
        fill: true,
        tension: 0.2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(11, 14, 20, 0.95)',
          titleColor: '#E8EAF0',
          bodyColor: '#E8EAF0',
          borderColor: 'rgba(212,175,55,0.5)',
          borderWidth: 1,
          callbacks: {
            title: (items) => items[0]?.label ?? '',
            label: (context) => {
              const candle = hist.candles[context.dataIndex];
              return [
                `Close: ₹${fmtNum(candle.close)}`,
                `Open: ₹${fmtNum(candle.open)}`,
                `High: ₹${fmtNum(candle.high)}`,
                `Low: ₹${fmtNum(candle.low)}`,
                `Volume: ${fmtNum(candle.volume, 0)}`
              ];
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#7C8394', maxTicksLimit: 8 },
          grid: { color: 'rgba(35, 40, 56, 0.5)' }
        },
        y: {
          ticks: { color: '#7C8394' },
          grid: { color: 'rgba(35, 40, 56, 0.5)' }
        }
      }
    }
  });
}

async function loadChartData(ticker, days = activeChartDays){
  if (!ticker) return;
  activeChartTicker = ticker;
  activeChartDays = days;
  document.querySelectorAll('.chart-range-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.days) === days);
  });

  const hist = await fetch(`${API}/stocks/${ticker}/history?days=${days}`).then(r=>r.json());
  renderChart(ticker, hist);
}

async function openModal(ticker){
  const s = stocksCache.find(x => x.ticker === ticker);
  if (!s) return;
  document.getElementById('mTicker').textContent = s.ticker;
  document.getElementById('mName').textContent = `${s.name} · ${s.sector}`;
  document.getElementById('mMetrics').innerHTML = `
    <div class="m"><div class="label">Price</div><div class="value">₹${fmtNum(s.price)}</div></div>
    <div class="m"><div class="label">Day Change</div><div class="value ${changeClass(s.day_change_pct||0)}">${changeSign(s.day_change_pct)}${fmtNum(s.day_change_pct)}%</div></div>
    <div class="m"><div class="label">Market Cap</div><div class="value">₹${fmtCr(s.market_cap_cr)} cr</div></div>
    <div class="m"><div class="label">P/E Ratio</div><div class="value">${fmtNum(s.pe_ratio)}x</div></div>
    <div class="m"><div class="label">EPS</div><div class="value">₹${fmtNum(s.eps)}</div></div>
    <div class="m"><div class="label">P/B Ratio</div><div class="value">${fmtNum(s.pb_ratio)}x</div></div>
    <div class="m"><div class="label">Dividend Yield</div><div class="value">${fmtNum(s.dividend_yield_pct)}%</div></div>
    <div class="m"><div class="label">52W High / Low</div><div class="value">₹${fmtNum(s.week52_high,0)} / ₹${fmtNum(s.week52_low,0)}</div></div>
  `;
  document.getElementById('overlay').classList.add('open');
  await loadChartData(ticker, activeChartDays);
}

document.querySelectorAll('.chart-range-btn').forEach(btn => {
  btn.onclick = async () => {
    if (!activeChartTicker) return;
    await loadChartData(activeChartTicker, Number(btn.dataset.days));
  };
});

document.getElementById('closeModal').onclick = () => document.getElementById('overlay').classList.remove('open');
document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') e.currentTarget.classList.remove('open'); };
document.getElementById('search').oninput = () => renderTable(stocksCache);
document.getElementById('sectorFilter').onchange = () => renderTable(stocksCache);
document.getElementById('sortBy').onchange = () => renderTable(stocksCache);

document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = 'Refreshing…';
  try {
    await fetch(`${API}/refresh`, { method: 'POST' });
    await loadAll();
  } finally {
    btn.disabled = false; btn.textContent = 'Refresh Data';
  }
};

document.getElementById('themeBtn').onclick = toggleTheme;
document.getElementById('clearFilters').onclick = () => {
  document.getElementById('search').value = '';
  document.getElementById('sectorFilter').value = '';
  currentQuickFilter = '';
  renderFilterPills();
  renderTable(stocksCache);
};
document.getElementById('sortDirection').onclick = () => {
  currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
